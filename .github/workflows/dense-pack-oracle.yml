name: Dense pack benchmark

on:
  pull_request:
    paths:
      - "fpga/bench/dense_pack/**"
      - ".github/workflows/dense-pack-oracle.yml"
  push:
    branches: [master]
    paths:
      - "fpga/bench/dense_pack/**"
      - ".github/workflows/dense-pack-oracle.yml"
  workflow_dispatch: {}

jobs:
  dense-pack-oracle:
    name: D3 D5 D7 packing oracle + RTL mapper
    runs-on: ubuntu-latest
    steps:
      - name: Check out fpga-lisp
        uses: actions/checkout@v4

      - name: Install RTL tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog yosys

      - name: Run capacity and round-trip oracle
        shell: bash
        run: |
          set -euo pipefail
          out="$(python3 fpga/bench/dense_pack/packing_oracle.py)"
          echo "$out"
          grep -q "PASS dense-pack capacity/oracle round-trips" <<<"$out"
          {
            echo "## Dense pack capacity oracle"
            echo
            echo "\`\`\`text"
            echo "$out"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run address mapper RTL + generic Yosys cost
        shell: bash
        run: |
          set -euo pipefail
          out="$(bash fpga/bench/dense_pack/run.sh)"
          echo "$out"
          grep -q "PASS dense-pack address maps" <<<"$out"
          {
            echo
            echo "## Dense pack address mapper"
            echo
            echo "\`\`\`text"
            echo "$out"
            echo "\`\`\`"
            echo
            echo "Generic mapper cost only; vendor BSRAM/P&R remains fpga-lisp#50."
          } >> "$GITHUB_STEP_SUMMARY"
