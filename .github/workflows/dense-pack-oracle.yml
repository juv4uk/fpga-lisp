name: Dense pack capacity oracle

on:
  pull_request:
    paths:
      - "fpga/bench/dense_pack/**"
      - ".github/workflows/dense-pack-oracle.yml"
  push:
    branches: [master]
    paths:
      - "fpga/bench/dense_pack/**"
      - ".github/workflows/dense-pack-oracle.yml"
  workflow_dispatch: {}

jobs:
  dense-pack-oracle:
    name: D3 D5 D7 packing oracle
    runs-on: ubuntu-latest
    steps:
      - name: Check out fpga-lisp
        uses: actions/checkout@v4

      - name: Run packing oracle
        shell: bash
        run: |
          set -euo pipefail
          out="$(python3 fpga/bench/dense_pack/packing_oracle.py)"
          echo "$out"
          grep -q "PASS dense-pack capacity/oracle round-trips" <<<"$out"
          {
            echo "## Dense pack capacity oracle"
            echo
            echo "\`\`\`text"
            echo "$out"
            echo "\`\`\`"
            echo
            echo "Capacity/correctness oracle only; not vendor hardware evidence."
          } >> "$GITHUB_STEP_SUMMARY"
